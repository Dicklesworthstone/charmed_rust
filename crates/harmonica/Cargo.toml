[package]
name = "charmed-harmonica"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/charmed-harmonica"
description = "Physics-based animation tools: spring oscillator and projectile motion"
keywords = ["animation", "spring", "physics", "tui", "terminal"]
categories = ["game-development", "simulation", "no-std"]

[lib]
name = "harmonica"

[features]
default = ["std"]
std = []

[dependencies]
# Math functions for `default-features = false` (no_std) builds. `sqrt`, `exp`,
# `sin` and `cos` are std-only inherent methods on f64, so without `std` the
# crate calls libm instead. It is a plain dependency rather than an optional one
# because Cargo cannot enable a dependency when a feature is *disabled*; as an
# optional dependency nothing ever turned it on and no_std builds failed.
libm = "0.2"

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
