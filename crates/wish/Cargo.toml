[package]
name = "charmed-wish"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/charmed-wish"
description = "Build SSH applications with bubbletea TUI interfaces"
keywords = ["ssh", "terminal", "tui", "server", "cli"]
categories = ["command-line-interface"]

[lib]
name = "wish"

[dependencies]
bubbletea = { workspace = true }
lipgloss = { workspace = true }
charmed_log = { workspace = true }
async-trait = "0.1"
tokio = { version = "1.52", features = ["full", "sync", "time", "net", "io-util", "macros", "rt-multi-thread"] }
thiserror = "2"
tracing = "0.1"
futures = "0.3"
parking_lot = "0.12"
bytes = "1.5"
lru = { workspace = true }
russh = { workspace = true }
# Note: we deliberately do NOT depend on the standalone `russh-keys` or
# `ssh-key` crates here. russh 0.60 re-exports `PublicKey`, `PrivateKey`,
# `Algorithm`, `PublicKeyBase64`, etc. via `russh::keys::*` from the
# `internal-russh-forked-ssh-key` crate it pins. Pulling in the
# standalone crates resolves to a different `ssh_key` version, and
# Cargo treats `russh::keys::PrivateKey` and `ssh_key::PrivateKey` as
# distinct types — that surfaces as `expected russh::keys::PrivateKey,
# found ssh_key::PrivateKey` at `Config::keys.push(key)`. See
# charmed_rust#44.

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
tempfile = { workspace = true }
portable-pty = "0.9.0"

[lints]
workspace = true
