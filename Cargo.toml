[workspace]
resolver = "2"
members = [
    "crates/harmonica",        # Smooth animations (standalone)
    "crates/lipgloss",         # Style definitions (standalone)
    "crates/charmed_log",      # Logging (uses lipgloss)
    "crates/bubbletea-macros", # Proc-macros for bubbletea
    "crates/bubbletea",        # TUI framework (uses lipgloss, harmonica)
    "crates/glamour",          # Markdown rendering (uses lipgloss)
    "crates/bubbles",          # TUI components (uses bubbletea, lipgloss)
    "crates/huh",              # Forms/prompts (uses bubbletea, lipgloss, bubbles)
    "crates/wish",             # SSH apps (uses bubbletea)
    "crates/glow",             # Markdown reader CLI (uses all)
    "crates/charmed-wasm",     # WASM bindings for web (uses lipgloss)
    "crates/demo_showcase",    # Flagship showcase (uses all)
    "tests/conformance",       # Conformance testing harness
]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Dicklesworthstone/charmed_rust"
homepage = "https://github.com/Dicklesworthstone/charmed_rust"
authors = ["Jeffrey Emanuel"]

[workspace.dependencies]
# Internal crates (for workspace members to depend on each other)
harmonica = { package = "charmed-harmonica", path = "crates/harmonica", version = "0.2.0" }
lipgloss = { package = "charmed-lipgloss", path = "crates/lipgloss", version = "0.2.0" }
charmed_log = { package = "charmed-log", path = "crates/charmed_log", version = "0.2.0" }
bubbletea-macros = { package = "charmed-bubbletea-macros", path = "crates/bubbletea-macros", version = "0.2.0" }
bubbletea = { package = "charmed-bubbletea", path = "crates/bubbletea", version = "0.2.0" }
glamour = { package = "charmed-glamour", path = "crates/glamour", version = "0.2.0" }
bubbles = { package = "charmed-bubbles", path = "crates/bubbles", version = "0.2.0" }
huh = { package = "charmed-huh", path = "crates/huh", version = "0.2.0" }
wish = { package = "charmed-wish", path = "crates/wish", version = "0.2.0" }
glow = { package = "charmed-glow", path = "crates/glow", version = "0.2.0" }
charmed-wasm = { path = "crates/charmed-wasm", version = "0.2.0" }
demo_showcase = { package = "charmed-demo-showcase", path = "crates/demo_showcase", version = "0.2.0" }

# Terminal & TUI
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1.13"
textwrap = "0.16"

# Colors & Styling
colored = "3.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Async runtime (for bubbletea event loop)
tokio = { version = "1.52", features = ["full"] }

# Markdown parsing (for glamour/glow)
pulldown-cmark = "0.13"

# SSH (for wish)
# 0.60 ships the GHSA-f5v4-2wr6-hqmg keyboard-interactive DoS fix and
# unblocks once internal-russh-forked-ssh-key 0.6.18 + ed25519-dalek
# 3.0.0-pre.6 line up against the published pkcs8 0.11.0 (verified
# 2026-05-02). We drop the `async-trait` feature: russh's `Handler`
# trait uses native return-position-impl-Future signatures and the
# wish workspace is on edition 2024 / Rust 1.85, which supports AFIT
# in trait impls natively. Mixing `#[async_trait]` on the impl side
# while the trait uses native AFIT triggers E0195 lifetime mismatches
# on every method. See charmed_rust#44.
russh = "0.62"
# `russh-keys` is intentionally absent. russh 0.60 re-exports its key
# types via `russh::keys::*` from `internal-russh-forked-ssh-key`;
# pulling in standalone `russh-keys` resolves to a different `ssh_key`
# version and creates type-mismatch friction at the boundary. See the
# matching note in crates/wish/Cargo.toml.

# Regex
regex = "1.11"

# Utilities
once_cell = "1.21"
bitflags = "2"
lru = "0.18"
chrono = "0.4"

# CLI (for glow binary)
clap = { version = "4.6", features = ["derive", "env"] }

# Progress/UI
indicatif = "0.17"

# Parallelism
rayon = "1.12"

# Dev dependencies
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3.1"
insta = { version = "1.47", features = ["json", "yaml"] }
proptest = "1.11.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
