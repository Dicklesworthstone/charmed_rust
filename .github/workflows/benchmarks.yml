name: Benchmarks

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: benchmarks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: |
          # Build all benchmark targets
          cargo bench --workspace --no-run
          # Run only named Criterion benchmarks (--benches still runs lib targets)
          cargo bench --bench bubbles_benchmarks --bench bubbletea_benchmarks --bench glamour_benchmarks --bench lipgloss_benchmarks -- --save-baseline pr

      - name: Download baseline (for PRs)
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow: benchmarks.yml
          branch: ${{ github.base_ref }}
          name: criterion-baseline
          path: target/criterion-baseline
        continue-on-error: true

      - name: Compare against baseline (for PRs)
        if: github.event_name == 'pull_request'
        id: compare
        run: |
          # Check if baseline exists
          if [ -d "target/criterion-baseline" ]; then
            echo "Baseline found, comparing..."

            # Copy baseline into criterion directory for comparison
            mkdir -p target/criterion
            cp -r target/criterion-baseline/* target/criterion/ 2>/dev/null || true

            # Run comparison benchmarks (only named Criterion benchmarks)
            cargo bench --bench bubbles_benchmarks --bench bubbletea_benchmarks --bench glamour_benchmarks --bench lipgloss_benchmarks -- --baseline main 2>&1 | tee benchmark-results.txt

            # Parse results for regressions.
            # NOTE: `grep -c` prints its count AND exits 1 when there are zero matches, so the
            # old `grep -c ... || echo "0"` appended a SECOND line, making WARNINGS="0\n0".
            # Writing that multiline value to "$GITHUB_OUTPUT" without heredoc syntax breaks
            # the step ("Invalid format '0'"). Count with `grep -c ... || true` so a no-match
            # (exit 1) is swallowed by errexit/pipefail and we keep grep's single-line "0".
            WARNINGS=$(grep -F -c "Performance has regressed" benchmark-results.txt || true)
            CRITICAL=$(grep -E -c "change: \\+[2-9][0-9]\\.[0-9]+%|\\+[1-9][0-9]{2,}\\.[0-9]+%" benchmark-results.txt || true)

            echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"
            echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"

            # Create summary
            {
              echo "## Benchmark Comparison Results"
              echo ""
              echo "### Summary"
              if [ "$WARNINGS" -gt 0 ]; then
                echo "- :warning: **$WARNINGS** benchmark(s) show performance regression"
              else
                echo "- :white_check_mark: No significant regressions detected"
              fi
              if [ "$CRITICAL" -gt 0 ]; then
                echo "- :x: **$CRITICAL** benchmark(s) regressed more than 20%"
              fi
              echo ""
              echo "<details>"
              echo "<summary>Full Benchmark Results</summary>"
              echo ""
              echo '```'
              cat benchmark-results.txt
              echo '```'
              echo "</details>"
            } > benchmark-summary.md
          else
            echo "No baseline found - this is the first benchmark run"
            echo "warnings=0" >> "$GITHUB_OUTPUT"
            echo "critical=0" >> "$GITHUB_OUTPUT"
            {
              echo "## Benchmark Results"
              echo ""
              echo ":information_source: No baseline available for comparison. Benchmarks will be compared on future PRs."
              echo ""
              echo "<details>"
              echo "<summary>Current Benchmark Results</summary>"
              echo ""
              echo '```'
              cargo bench --bench bubbles_benchmarks --bench bubbletea_benchmarks --bench glamour_benchmarks --bench lipgloss_benchmarks 2>&1 | head -200
              echo '```'
              echo "</details>"
            } > benchmark-summary.md
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('benchmark-summary.md', 'utf8');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Benchmark Comparison Results') || comment.body.includes('Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
            }

      - name: Check for critical regressions
        if: github.event_name == 'pull_request'
        run: |
          CRITICAL="${{ steps.compare.outputs.critical }}"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Critical performance regression detected: $CRITICAL benchmark(s) regressed more than 20%"
            exit 1
          fi

          WARNINGS="${{ steps.compare.outputs.warnings }}"
          if [ "$WARNINGS" -gt 0 ]; then
            echo "::warning::Performance regression detected: $WARNINGS benchmark(s) show regression"
          fi

      - name: Save baseline (on push to main)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          # Run benchmarks and save as baseline (only named Criterion benchmarks)
          cargo bench --bench bubbles_benchmarks --bench bubbletea_benchmarks --bench glamour_benchmarks --bench lipgloss_benchmarks -- --save-baseline main

          # Copy criterion data for artifact
          mkdir -p criterion-baseline
          cp -r target/criterion/* criterion-baseline/ 2>/dev/null || true

      - name: Upload baseline artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-baseline
          path: criterion-baseline/
          retention-days: 30
          if-no-files-found: warn
